# Paper profile: replicates archive/original_colab_notebook.ipynb exactly, quirks included.
name: paper
seed: 42
output_dir: results/paper

data:
  path: data/raw/healthcare-dataset-stroke-data.csv

preprocessing:
  # "full_data_mean": BMI mean of all 5,110 rows, before the split (the original's small leak).
  # "train_mean": mean of the training rows only (corrected profile).
  bmi_imputation: full_data_mean

split:
  test_size: 0.2
  random_state: 42
  stratify: true

regimes: [none, smote, smoteenn]

models:
  lr:
    params:
      max_iter: 1000
      random_state: 42
    # Quirk of the original: only the SMOTE variant set class_weight="balanced".
    # On a perfectly balanced training set this has no effect.
    overrides:
      smote:
        class_weight: balanced
  svm:
    params:
      kernel: rbf
      probability: true
      random_state: 42
  xgb:
    params:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 4
      subsample: 0.8
      colsample_bytree: 0.8
      objective: "binary:logistic"
      eval_metric: logloss
      # The notebook used n_jobs=-1 on a Colab VM with 2 CPUs. XGBoost "hist" results depend on
      # the thread count, so this pins 2 threads for readers with more cores.
      n_jobs: 2
      random_state: 42

# Phase 2 reconstructions. The notebook has no code for these; settings are fixed, not tuned.
cv:
  # Table V: repeated stratified CV on the 4,088 training rows. Scaling and resampling are
  # fit inside each training fold (imblearn Pipeline).
  n_splits: 5
  n_repeats: 5
  random_state: 42
  regimes: [smote, smoteenn]
  n_jobs: -1  # parallel folds; each fold's estimators carry their own fixed seeds

explain:
  # Fig 5 (SHAP), XGBoost gain importance and LR coefficients, on the hold-out test set.
  regime: smote

calibration:
  # Fig 6: reliability curves and Brier scores on the hold-out test set.
  regime: smote
  n_bins: 10
