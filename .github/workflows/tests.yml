name: tests

on:
  push:
  workflow_dispatch:

jobs:
  reproduce:
    # Pinned image: the exact XGBoost results depend on the platform build, so a runner image
    # change must be a deliberate edit here, not an automatic migration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Environment
        run: |
          python - <<'EOF'
          import os, platform, json
          import xgboost
          print("platform:", platform.platform())
          print("python:", platform.python_version())
          print("os.cpu_count():", os.cpu_count())
          print("xgboost:", xgboost.__version__)
          print("xgboost.build_info():")
          print(json.dumps(xgboost.build_info(), indent=2, default=str))
          EOF

      - name: Download data
        run: python -m stroke_imbalance.data

      - name: Reproduce (paper profile, all stages)
        run: python -m stroke_imbalance.run --config configs/paper.yaml

      - name: Reproduce (corrected profile, compared with the paper profile)
        run: python -m stroke_imbalance.run --config configs/corrected.yaml

      - name: Tests
        run: python -m pytest -v

      # Linux is the reference platform: the committed results/ come from this artifact.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-linux
          path: results/
          if-no-files-found: warn
